[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hrl-uav-v2"
version = "2.1.0"
description = "Finite-horizon UAV computation offloading with hierarchical PPO and SAC"
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = ["numpy>=1.26,<2", "torch>=2.7.0.dev0,<3"]

[project.optional-dependencies]
baselines = ["cvxpy>=1.6,<2", "scipy>=1.11,<2"]
dev = ["build>=1.2", "pytest>=7,<9"]

[project.scripts]
hrl-v2 = "hrl_v2.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["hrl_v2", "hrl_v2.design", "hrl_v2.tests", "hrl_uav"]
include-package-data = false

[tool.setuptools.package-data]
hrl_v2 = ["configs/*.json", "_reference/manifest.json", "_reference/hrl_v2/*.py", "_reference/hrl_v2/configs/*.json", "_reference/hrl_v2/design/*.py", "_reference/hrl_v2/tests/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
